<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График цен — Royal Regency Club</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .back { margin-bottom: 10px; }
        #chart { height: 520px; }
    </style>
<head>
<body>
    <div class="back"><a href="../../index.html">← Назад к дашборду</a></div>
    <h2>График цен: Royal Regency Club</h2>
    <div id="chart"></div>
    <script>
      const x = ["2026-05-28 11:52", "2026-05-28 13:48", "2026-05-28 15:49", "2026-05-28 19:38", "2026-05-28 22:12", "2026-05-29 00:33"];
      const y = [7510.0, 7510.0, 7510.0, 7208.0, 7208.0, 7208.0];
      const trace = {
        x: x,
        y: y,
        type: 'scatter',
        mode: 'lines+markers',
        line: { color: '#2E86AB', width: 3 },
        marker: { size: 8 }
      };
      const layout = {
        title: 'История цен',
        xaxis: { title: 'Время' },
        yaxis: { title: 'Цена (PLN)' }
      };
      Plotly.newPlot('chart', [trace], layout);
    </script>
  </body>
